server {
    listen 80;

    location /auth/ {
        proxy_pass http://backend:8000;
    }

    location /merchants/ {
        proxy_pass http://backend:8000;
    }

    location /committee/ {
        proxy_pass http://backend:8000;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
