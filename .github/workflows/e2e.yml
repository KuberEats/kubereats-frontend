name: E2E Release Verification

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.12.0"

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
      E2E_CAMPUS: ${{ vars.E2E_CAMPUS }}
      E2E_MERCHANT_NAME: ${{ vars.E2E_MERCHANT_NAME }}
      E2E_MENU_ITEM_NAME: ${{ vars.E2E_MENU_ITEM_NAME }}
      E2E_SEED_WEBHOOK_URL: ${{ secrets.E2E_SEED_WEBHOOK_URL }}
      E2E_SEED_TOKEN: ${{ secrets.E2E_SEED_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate E2E configuration
        shell: bash
        run: |
          missing=0
          for name in E2E_BASE_URL VITE_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions variable: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify E2E seed data
        run: npm run seed:e2e-data

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14
